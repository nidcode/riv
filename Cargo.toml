[package]
name = "riv-reinvent"
version = "0.1.0"
edition = "2024"
description = "re:Invent as Code: declare your agenda in a Kiro spec, plan the diff, apply it safely"
license = "Apache-2.0"
repository = "https://github.com/OWNER/riv"
homepage = "https://github.com/OWNER/riv"
readme = "README.md"
keywords = ["reinvent", "aws", "kiro", "mcp", "agenda"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[lib]
name = "riv"
path = "src/lib.rs"

[[bin]]
name = "riv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures-core = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros", "client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
